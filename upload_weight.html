<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Weight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0d0d0f',
                        card: '#1e1f23',
                        cardHover: '#2a2b30',
                        textPrimary: '#ffffff',
                        textSecondary: '#9ca3af',
                        accent: '#ffffff'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0d0f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .mobile-container { width: 100%; max-width: 400px; background-color: #0d0d0f; height: 850px; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 0 0 10px #1a1a1a, 0 25px 50px -12px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .hover-target { position: relative; outline: 2px solid transparent; transition: outline 0.2s ease; }
    </style>
</head>
<body>

    <!-- Page Marking Badge & Switcher -->
    <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[999999] bg-[#1e1f23]/95 backdrop-blur-md border border-gray-700/80 rounded-full px-4 py-1.5 shadow-2xl flex items-center space-x-3 text-xs">
        <span class="bg-emerald-600 text-white font-bold px-2 py-0.5 rounded-full text-[11px] tracking-wide shadow-sm">PAGE 2</span>
        <span class="font-semibold text-white">Log Weight</span>
        <span class="text-gray-600">|</span>
        <div class="flex items-center space-x-1.5 text-textSecondary font-medium">
            <a href="index.html" class="px-2 py-0.5 rounded-md hover:bg-gray-800 hover:text-white transition-colors">P1: Dashboard</a>
            <a href="upload_weight.html" class="px-2 py-0.5 rounded-md bg-white/20 text-white font-bold">P2</a>
            <a href="log_workout.html" class="px-2 py-0.5 rounded-md hover:bg-gray-800 hover:text-white transition-colors">P3: Log</a>
            <a href="saved_workouts.html" class="px-2 py-0.5 rounded-md hover:bg-gray-800 hover:text-white transition-colors">P4: Saved</a>
        </div>
    </div>

    <div class="mobile-container overflow-hidden relative">
        <div class="flex-1 overflow-y-auto no-scrollbar pb-32 w-full">
        <header class="flex justify-between items-center px-6 pt-12 pb-6 hover-target">
            <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-card rounded-full flex justify-center items-center hover:bg-cardHover transition-colors hover-target">
                <i class="ph ph-caret-left text-xl"></i>
            </button>
            <h1 class="text-xl font-bold tracking-tight hover-target">Log Weight</h1>
            <button id="btnSaveHeader" class="w-10 h-10 rounded-full flex justify-center items-center text-white font-semibold hover-target">Save</button>
        </header>

        <main class="px-6 space-y-8 mt-6">
            <div class="flex flex-col items-center justify-center space-y-4">
                <div class="flex items-baseline space-x-2 hover-target p-2">
                    <input id="weightInput" type="number" step="0.1" value="86.2" class="bg-transparent text-center text-7xl font-bold text-white w-full max-w-[300px] focus:outline-none placeholder-gray-700" placeholder="0.0">
                </div>
                <div class="bg-card p-1 rounded-full flex space-x-1 hover-target">
                    <button id="btnKg" class="px-4 py-1.5 rounded-full bg-[#2a2b30] text-white text-sm font-semibold shadow-sm hover-target transition-all">kg</button>
                    <button id="btnLbs" class="px-4 py-1.5 rounded-full text-textSecondary hover:text-white text-sm font-semibold transition-all hover-target">lbs</button>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-card rounded-2xl p-4 flex justify-between items-center hover:bg-cardHover cursor-pointer transition-colors hover-target relative overflow-hidden">
                    <input id="dateInput" type="datetime-local" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                    <div class="flex items-center space-x-3 pointer-events-none">
                        <div class="w-10 h-10 rounded-full bg-gray-800 flex justify-center items-center">
                            <i class="ph ph-calendar-blank text-lg text-white"></i>
                        </div>
                        <span class="font-medium">Date</span>
                    </div>
                    <div class="flex items-center space-x-2 text-textSecondary pointer-events-none">
                        <span id="dateDisplay" class="text-sm">Today, 8:45 AM</span>
                        <i class="ph ph-caret-right text-sm"></i>
                    </div>
                </div>

                <div class="bg-card rounded-2xl p-4 flex flex-col space-y-2 hover-target">
                    <label class="font-medium flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-gray-800 flex justify-center items-center">
                            <i class="ph ph-text-align-left text-lg text-white"></i>
                        </div>
                        <span>Notes</span>
                    </label>
                    <textarea id="notesInput" class="bg-transparent w-full resize-none focus:outline-none text-sm text-textSecondary pl-14 placeholder-gray-600 hover-target" rows="2" placeholder="How are you feeling today?"></textarea>
                </div>
            </div>

            <!-- History Section -->
            <div class="pt-6 pb-4">
                <h3 class="font-semibold text-lg mb-4 hover-target">History</h3>
                <div id="historyList" class="space-y-3">
                    <!-- History items rendered here -->
                </div>
            </div>

            <!-- Spacer so content scrolls completely clear of bottom bar -->
            <div class="h-28 w-full flex-shrink-0"></div>
        </main>
        </div>

        <!-- Fixed Bottom Action Bar with Gradient Blur -->
        <div class="absolute bottom-0 left-0 right-0 px-6 pt-6 pb-6 bg-gradient-to-t from-[#0d0d0f] via-[#0d0d0f] to-transparent z-40">
            <button id="btnSaveBottom" class="w-full bg-white text-black font-semibold rounded-2xl py-4 text-[15px] hover:bg-gray-200 transition-colors shadow-[0_0_20px_rgba(255,255,255,0.1)] hover-target">
                Save Weight
            </button>
            <div class="w-1/3 h-1 bg-white/30 rounded-full mx-auto mt-3"></div>
        </div>

        <!-- Note Modal -->
        <div id="noteModal" style="display: none;" class="absolute inset-0 z-[999] justify-center items-center p-6">
            <!-- Backdrop -->
            <div class="absolute inset-0 bg-black/60 backdrop-blur-[2px]" onclick="document.getElementById('noteModal').style.display='none'"></div>
            <!-- Modal Content -->
            <div class="bg-card w-full rounded-3xl p-6 relative z-10 shadow-2xl border border-gray-800">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="text-lg font-bold text-white hover-target">Log Details</h3>
                        <p id="modalDate" class="text-xs text-textSecondary mt-1 hover-target"></p>
                    </div>
                    <button onclick="document.getElementById('noteModal').style.display='none'" class="w-8 h-8 bg-gray-800 rounded-full flex justify-center items-center hover:bg-gray-700 transition-colors hover-target">
                        <i class="ph ph-x text-white"></i>
                    </button>
                </div>
                <div class="mb-4 hover-target">
                    <span id="modalWeight" class="text-3xl font-bold tracking-tight text-white"></span>
                </div>
                <div class="bg-[#15161a] rounded-2xl p-4 hover-target">
                    <p id="modalNoteText" class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed"></p>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Load previous weight if exists
            let currentUnit = 'kg';
            const saved = JSON.parse(localStorage.getItem('workout_last_weight') || 'null');
            if (saved) {
                document.getElementById('weightInput').value = saved.weight;
                currentUnit = saved.unit;
            }

            const btnKg = document.getElementById('btnKg');
            const btnLbs = document.getElementById('btnLbs');
            const weightInput = document.getElementById('weightInput');
            
            // Set initial date
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('dateInput').value = now.toISOString().slice(0,16);
            updateDateDisplay();

            function updateDateDisplay() {
                const date = new Date(document.getElementById('dateInput').value);
                const options = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
                document.getElementById('dateDisplay').textContent = date.toLocaleDateString('en-US', options);
            }
            document.getElementById('dateInput').addEventListener('change', updateDateDisplay);

            function updateUnits(newUnit) {
                if (currentUnit === newUnit) return;
                let val = parseFloat(weightInput.value) || 0;
                
                if (newUnit === 'kg') {
                    val = val / 2.20462;
                    btnKg.className = 'px-4 py-1.5 rounded-full bg-[#2a2b30] text-white text-sm font-semibold shadow-sm hover-target transition-all';
                    btnLbs.className = 'px-4 py-1.5 rounded-full text-textSecondary hover:text-white text-sm font-semibold transition-all hover-target';
                } else {
                    val = val * 2.20462;
                    btnLbs.className = 'px-4 py-1.5 rounded-full bg-[#2a2b30] text-white text-sm font-semibold shadow-sm hover-target transition-all';
                    btnKg.className = 'px-4 py-1.5 rounded-full text-textSecondary hover:text-white text-sm font-semibold transition-all hover-target';
                }
                
                weightInput.value = val.toFixed(1);
                currentUnit = newUnit;
            }

            btnKg.addEventListener('click', () => updateUnits('kg'));
            btnLbs.addEventListener('click', () => updateUnits('lbs'));
            
            // Initialize unit UI
            if (currentUnit === 'lbs') { currentUnit = 'kg'; updateUnits('lbs'); }

            function saveWeight() {
                const data = {
                    weight: document.getElementById('weightInput').value,
                    unit: currentUnit,
                    date: document.getElementById('dateInput').value,
                    notes: document.getElementById('notesInput').value,
                    timestamp: Date.now()
                };
                localStorage.setItem('workout_last_weight', JSON.stringify(data));
                
                let history = JSON.parse(localStorage.getItem('workout_weight_history') || '[]');
                history.unshift(data);
                localStorage.setItem('workout_weight_history', JSON.stringify(history));
                
                window.location.href = 'index.html';
            }

            function renderHistory() {
                const history = JSON.parse(localStorage.getItem('workout_weight_history') || '[]');
                const list = document.getElementById('historyList');
                if (history.length === 0) {
                    list.innerHTML = '<p class="text-textSecondary text-sm text-center py-4">No records yet.</p>';
                    return;
                }
                
                let html = '';
                history.forEach((item, index) => {
                    const dateObj = new Date(item.date || item.timestamp);
                    const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    const timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                    const noteSafe = encodeURIComponent(item.notes || '');
                    
                    html += `
                    <div class="history-item bg-card rounded-2xl p-4 flex justify-between items-center hover-target cursor-pointer hover:bg-cardHover transition-colors group"
                         data-weight="${item.weight}" data-unit="${item.unit}" data-date="${dateStr}" data-time="${timeStr}" data-notes="${noteSafe}">
                        <div>
                            <div class="font-bold text-lg">${parseFloat(item.weight).toFixed(1)} <span class="text-sm font-medium text-textSecondary">${item.unit}</span></div>
                            <div class="text-xs text-textSecondary">${dateStr}, ${timeStr}</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            ${item.notes ? `<div class="text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded-xl max-w-[100px] truncate">${item.notes}</div>` : ''}
                            <button data-index="${index}" class="delete-btn text-gray-600 hover:text-red-500 transition-colors p-1">
                                <i class="ph ph-trash text-lg pointer-events-none"></i>
                            </button>
                        </div>
                    </div>
                    `;
                });
                list.innerHTML = html;
            }
            renderHistory();

            document.getElementById('historyList').addEventListener('click', (e) => {
                const deleteBtn = e.target.closest('.delete-btn');
                if (deleteBtn) {
                    e.stopPropagation();
                    let history = JSON.parse(localStorage.getItem('workout_weight_history') || '[]');
                    history.splice(parseInt(deleteBtn.dataset.index, 10), 1);
                    localStorage.setItem('workout_weight_history', JSON.stringify(history));
                    renderHistory();
                    return;
                }

                const item = e.target.closest('.history-item');
                if (item) {
                    const note = decodeURIComponent(item.dataset.notes);
                    document.getElementById('modalDate').textContent = `${item.dataset.date}, ${item.dataset.time}`;
                    document.getElementById('modalWeight').textContent = `${parseFloat(item.dataset.weight).toFixed(1)} ${item.dataset.unit}`;
                    document.getElementById('modalNoteText').textContent = note || 'No notes added for this log.';
                    document.getElementById('noteModal').style.display = 'flex';
                    setTimeout(refreshHoverTargets, 10);
                }
            });

            document.getElementById('btnSaveHeader').addEventListener('click', saveWeight);
            document.getElementById('btnSaveBottom').addEventListener('click', saveWeight);

            // Hover labels script
            const label = document.createElement('div');
            label.style.position = 'fixed';
            label.style.backgroundColor = '#ff0055';
            label.style.color = 'white';
            label.style.fontWeight = 'bold';
            label.style.fontSize = '12px';
            label.style.width = '24px';
            label.style.height = '24px';
            label.style.display = 'none';
            label.style.justifyContent = 'center';
            label.style.alignItems = 'center';
            label.style.borderRadius = '50%';
            label.style.zIndex = '99999999';
            label.style.pointerEvents = 'none';
            label.style.boxShadow = '0 2px 10px rgba(0,0,0,0.8)';
            label.style.fontFamily = 'Inter, sans-serif';
            document.body.appendChild(label);

            function refreshHoverTargets() {
                let count = 0;
                document.querySelectorAll('.hover-target').forEach((el) => {
                    const isHiddenParent = el.closest('[style*="display: none"]');
                    if (isHiddenParent) return;

                    count++;
                    const id = count;
                    el.setAttribute('data-id', id);

                    el.onmouseenter = (e) => {
                        e.stopPropagation();
                        const rect = el.getBoundingClientRect();
                        label.textContent = id;
                        label.style.display = 'flex';
                        label.style.top = Math.max(4, rect.top - 10) + 'px';
                        label.style.left = Math.max(4, rect.left - 10) + 'px';
                        el.style.outline = '2px dashed #ff0055';
                    };
                    el.onmouseleave = () => {
                        label.style.display = 'none';
                        el.style.outline = '';
                    };
                });
            }
            window.refreshHoverTargets = refreshHoverTargets;
            refreshHoverTargets();
        });
    </script>
</body>
</html>
